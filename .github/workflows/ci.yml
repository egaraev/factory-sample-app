name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout factory-manifests
        uses: actions/checkout@v4
        with:
          repository: egaraev/factory-manifests
          token: ${{ secrets.MANIFESTS_WRITE_PAT }}
          path: manifests

      # KAN-81: rewrite only the sample-app "image:" line, preserving its
      # indentation and every other byte of the manifest. The match requires a
      # non-space run (any tag) between "factory-sample-app" and end-of-line,
      # so running this twice — or when the line already holds this exact sha
      # — leaves the file byte-for-byte identical.
      - name: Pin sample-app image to this build's SHA
        run: |
          set -euo pipefail
          manifest="manifests/k8s/sample-app/deployment.yaml"
          sed -i -E "s|^([[:space:]]*image:[[:space:]]*)([^[:space:]]*factory-sample-app[^[:space:]]*)[[:space:]]*$|\1ghcr.io/egaraev/factory-sample-app:${{ github.sha }}|" "$manifest"

      # Only commit/push when the previous step actually changed the file, so
      # an already-pinned manifest is a safe no-op (no empty commits).
      - name: Commit and push manifest update
        run: |
          set -euo pipefail
          cd manifests
          if [ -n "$(git status --porcelain -- k8s/sample-app/deployment.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add k8s/sample-app/deployment.yaml
            git commit -m "deploy: factory-sample-app@${{ github.sha }}"
            git push origin HEAD:main
          else
            echo "k8s/sample-app/deployment.yaml already pinned to ${{ github.sha }} — nothing to do."
          fi
