name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  # staged-delivery part 1: nothing built here gets anywhere (staging or
  # production) until this passes. scans the exact image build-and-push just
  # pushed, by its sha tag, not :latest -- so what's scanned is always the
  # same bits that would actually get deployed
  security-scan:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Scan image for CRITICAL/HIGH vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0 -- pinned to the commit sha, not a mutable tag: trivy-action had 76 of its 77 tags force-pushed to a malicious commit in a March 2026 supply-chain compromise (GHSA-69fq-xp46-6x23)
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          # a CVE with no fix released yet would otherwise block every single
          # build forever with nothing anyone can do about it -- only fail on
          # the ones there's actually a fixed version to upgrade to
          ignore-unfixed: true

  deploy:
    needs: [build-and-push, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout factory-manifests
        uses: actions/checkout@v4
        with:
          repository: egaraev/factory-manifests
          token: ${{ secrets.MANIFESTS_WRITE_PAT }}
          path: manifests
          ref: main
          fetch-depth: 0

      - name: Pin sample-app image to this build's SHA
        run: |
          set -euo pipefail
          manifest="manifests/k8s/sample-app/deployment.yaml"
          sed -i -E "s|^([[:space:]]*image:[[:space:]]*)([^[:space:]]*factory-sample-app[^[:space:]]*)[[:space:]]*$|\1ghcr.io/egaraev/factory-sample-app:${{ github.sha }}|" "$manifest"

      - name: Commit and push manifest update
        run: |
          set -euo pipefail
          cd manifests
          if [ -n "$(git status --porcelain -- k8s/sample-app/deployment.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add k8s/sample-app/deployment.yaml
            git commit -m "deploy: factory-sample-app@${{ github.sha }}"
            git push origin HEAD:main
          else
            echo "k8s/sample-app/deployment.yaml already pinned to ${{ github.sha }}; nothing to do."
          fi
